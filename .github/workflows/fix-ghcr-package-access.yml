name: Fix GHCR package access
on:
  workflow_dispatch:
jobs:
  link:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
          steps:
      - name: Link package to repo + grant Actions write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          PKG=am-trade-management-service
          REPO_ID=$(gh api repos/${{ github.repository }} --jq .id)
          echo "repo_id=$REPO_ID"
          # Show current linked repos
          gh api "orgs/${{ github.repository_owner }}/packages/container/$PKG/repositories" || true
          # Link repository to package
          gh api --method PUT \
            "orgs/${{ github.repository_owner }}/packages/container/$PKG/repositories/$REPO_ID" \
            -i || true
          # Set package to inherit access from linked repo if supported
          gh api --method PUT \
            "orgs/${{ github.repository_owner }}/packages/container/$PKG" \
            -f repository_id="$REPO_ID" || true
          # Retry link
          gh api --method PUT \
            "orgs/${{ github.repository_owner }}/packages/container/$PKG/repositories/$REPO_ID"
          echo "LINKED"
          # Verify push
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "FROM scratch" > Df
          docker build -f Df -t ghcr.io/am-portfolio/$PKG:acl-probe2 .
          docker push ghcr.io/am-portfolio/$PKG:acl-probe2 && echo REAL_PUSH_OK || echo REAL_PUSH_FAIL
