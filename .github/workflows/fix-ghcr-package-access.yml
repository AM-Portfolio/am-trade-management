name: Fix GHCR package access
on:
  workflow_dispatch:
jobs:
  link:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Link package to repo and verify push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          PKG=am-trade-management-service
          REPO_ID=$(gh api repos/${{ github.repository }} --jq .id)
          echo "repo_id=$REPO_ID"
          gh api "orgs/${{ github.repository_owner }}/packages/container/$PKG/repositories" || true
          gh api --method PUT "orgs/${{ github.repository_owner }}/packages/container/$PKG/repositories/$REPO_ID"
          echo LINKED_OK
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "FROM scratch" > Df
          docker build -f Df -t "ghcr.io/am-portfolio/$PKG:acl-probe3" .
          docker push "ghcr.io/am-portfolio/$PKG:acl-probe3"
          echo REAL_PUSH_OK
