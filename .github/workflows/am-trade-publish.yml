# Slim Contabo graph: Build once; Auto sync preprod on main only; Contabo Approve matrix.
name: AM Trade Management Publish

on:
  push:
    branches: ["main", "develop", "fix/**", "hotfix/**", "feature/**", "feat/**"]
    paths:
      - "**/*.java"
      - "**/pom.xml"
      - "**/src/main/resources/**"
      - "Dockerfile"
      - ".github/workflows/am-trade-publish.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "**/*.java"
      - "**/pom.xml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish AM Trade Management
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "java"
      working_directory: "."
      image_name: "am-trade-management-service"
      build_context: "."
    secrets: inherit
