name: AM Trade Publish

on:
  push:
    branches: ["main", "develop", "feature/**", "test/**", "fix/**", "hotfix/**"]
    paths:
      - "**/*.java"
      - "**/pom.xml"
      - "**/src/main/resources/**"
      - "helm/**"
      - "Dockerfile"
      - "settings.xml"
      - ".github/workflows/am-trade-publish.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "**/*.java"
      - "**/pom.xml"
      - "**/src/main/resources/**"
      - "helm/**"
      - "Dockerfile"
      - "settings.xml"
      - ".github/workflows/am-trade-publish.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish AM Trade Management
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: 'java'
      working_directory: '.'
      image_name: 'am-trade-management-service'
      build_context: '.'
      # Contabo scripts (argo-pin-then-sync.sh) live on am-pipelines main; develop is missing them.
      pipelines_ref: 'main'
    secrets: inherit
