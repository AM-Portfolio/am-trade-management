name: AM Trade Publish

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish UI
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: 'java'
      working_directory: '.'
      image_name: 'am-trade-management-service'
      build_context: '.'
      skip_secrets_scan: true
    secrets: inherit
