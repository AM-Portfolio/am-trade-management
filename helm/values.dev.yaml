# Dev Environment — am-trade-management
environment: dev
replicaCount: 1


resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

global:
  vault:
    enabled: true
    secrets:
      otel:
        path: "apps/data/dev/infra/observability"
      auth:
        path: "apps/data/dev/services/am-auth"
      infra:
        path: "apps/data/dev/infra/shared-api"
      mongo:
        path: "apps/data/dev/infra/mongodb"
      kafka:
        path: "apps/data/dev/infra/kafka"
      redis:
        path: "apps/data/dev/infra/redis"
      app:
        path: "apps/data/dev/services/am-trade-management"
      identity-oidc:
        path: "apps/data/dev/services/am-identity"
      service-oauth:
        path: "apps/data/dev/services/am-trade-management"

hostAliases:
  - ip: "203.174.22.129"
    hostnames:
      - "redis.asrax.in"
      - "mongodb.asrax.in"
      - "kafka.asrax.in"
      - "am-dev.asrax.in"
      - "am.asrax.in"

probes:
  port: 8080
  startup:
    path: "/actuator/health"
    failureThreshold: 30
    periodSeconds: 10
  liveness:
    path: "/actuator/health"
  readiness:
    path: "/actuator/health"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-dev-dev-global-cors@kubernetescrd,
      am-apps-dev-dev-strip-prefix@kubernetescrd
  hosts:
    - host: am-dev.asrax.in
      paths:
        - path: /trade
          pathType: Prefix

env:
  SPRING_PROFILES_ACTIVE: "dev"
  AM_TRADE_CACHE_ENABLED: "false"
  SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration"
  # Enable Kafka so portfolio/trade sync events are published
  AM_TRADE_KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.infra-dev.svc.cluster.local:9092"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  AM_TRADE_KAFKA_HOLDING_UPDATE_TOPIC: "am-portfolio"
  AM_TRADE_KAFKA_PORTFOLIO_UPDATE_CONSUMER_ENABLED: "true"
  AM_TRADE_KAFKA_PORTFOLIO_UPDATE_TOPIC: "am-portfolio-update"
  AM_TRADE_KAFKA_PORTFOLIO_UPDATE_CONSUMER_GROUP_ID: "am-trade-portfolio-update-group"
  AM_TRADE_KAFKA_TRADE_CONSUMER_ENABLED: "true"
  AM_TRADE_KAFKA_TRADE_TOPIC: "am-trade"
  AM_TRADE_KAFKA_TRADE_CONSUMER_GROUP_ID: "am-trade-group"
