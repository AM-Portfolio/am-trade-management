# Pre-production configuration for am-trade-management.
# Dual-host: am-preprod (target) + am.asrax.in (current preprod until Phase 4)

environment: "preprod"
replicaCount: 1

global:
  vault:
    enabled: true
    secrets:
      auth:
        path: "apps/data/preprod/services/am-auth"
      infra:
        path: "apps/data/preprod/infra/shared-api"
      mongo:
        path: "apps/data/preprod/infra/mongodb"
      kafka:
        path: "apps/data/preprod/infra/kafka"
      redis:
        path: "apps/data/preprod/infra/redis"
      app:
        path: "apps/data/preprod/services/am-trade-management"
      market-data:
        path: "apps/data/preprod/services/am-market-data"
      identity-oidc:
        path: "apps/data/preprod/services/am-identity"
      service-oauth:
        path: "apps/data/preprod/services/am-trade-management"
env:
  SPRING_PROFILES_ACTIVE: "preprod"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd,
      am-apps-preprod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am-preprod.asrax.in
      paths:
        - path: /trade
          pathType: Prefix
        - path: /trades
          pathType: Prefix
    - host: am.asrax.in
      paths:
        - path: /trade
          pathType: Prefix
        - path: /trades
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
