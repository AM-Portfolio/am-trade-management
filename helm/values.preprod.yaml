# Pre-production configuration for am-trade-management.
# Preprod app host only — am.asrax.in reserved for prod

environment: "preprod"
replicaCount: 1

global:
  vault:
    enabled: true
    secrets:
      otel:
        path: "apps/data/preprod/infra/observability"
      auth:
        path: "apps/data/preprod/services/am-auth"
      infra:
        path: "apps/data/preprod/infra/shared-api"
      mongo:
        path: "apps/data/preprod/infra/mongodb"
      kafka:
        path: "apps/data/preprod/infra/kafka"
      redis:
        path: "apps/data/preprod/infra/redis"
      app:
        path: "apps/data/preprod/services/am-trade-management"
      identity-oidc:
        path: "apps/data/preprod/services/am-identity"
      service-oauth:
        path: "apps/data/preprod/services/am-trade-management"
env:
  SPRING_PROFILES_ACTIVE: "preprod"
  # Enable Kafka so portfolio/trade sync events are published
  AM_TRADE_KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.infra-dev.svc.cluster.local:9092"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  AM_TRADE_KAFKA_HOLDING_UPDATE_TOPIC: "am-portfolio"
  AM_TRADE_KAFKA_PORTFOLIO_UPDATE_CONSUMER_ENABLED: "true"
  AM_TRADE_KAFKA_PORTFOLIO_UPDATE_TOPIC: "am-portfolio-update"
  AM_TRADE_KAFKA_PORTFOLIO_UPDATE_CONSUMER_GROUP_ID: "am-trade-portfolio-update-group"
  AM_TRADE_KAFKA_TRADE_CONSUMER_ENABLED: "true"
  AM_TRADE_KAFKA_TRADE_TOPIC: "am-trade"
  AM_TRADE_KAFKA_TRADE_CONSUMER_GROUP_ID: "am-trade-group"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd,
      am-apps-preprod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am-preprod.asrax.in
      paths:
        - path: /trade
          pathType: Prefix
        - path: /trades
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
