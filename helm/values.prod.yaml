# Production configuration for am-trade-management.
# Service-level Ingress (same model as am-identity).

replicaCount: 1

environment: "prod"

global:
  vault:
    enabled: true
    secrets:
      infra:
        path: "apps/data/prod/infra/shared-api"
      mongo:
        path: "apps/data/prod/infra/mongodb"
      kafka:
        path: "apps/data/prod/infra/kafka"
      redis:
        path: "apps/data/prod/infra/redis"
      app:
        path: "apps/data/prod/services/am-trade-management"
      market-data:
        path: "apps/data/prod/services/am-market-data"
      identity-oidc:
        path: "apps/data/prod/services/am-identity"
      service-oauth:
        path: "apps/data/prod/services/am-trade-management"

env:
  SPRING_PROFILES_ACTIVE: "prod"
  KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /trade
          pathType: Prefix
        - path: /trades
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi
