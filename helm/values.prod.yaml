# Production configuration for am-trade-management.
# Service-level Ingress (same model as am-identity).

replicaCount: 1

environment: "prod"

global:
  vault:
    enabled: true
    secrets:
      otel:
        path: "apps/data/prod/infra/observability"
      auth:
        path: "apps/data/prod/services/am-auth"
      infra:
        path: "apps/data/prod/infra/shared-api"
      mongo:
        path: "apps/data/prod/infra/mongodb"
      kafka:
        path: "apps/data/prod/infra/kafka"
      app:
        path: "apps/data/prod/services/am-trade-management"
      identity-oidc:
        path: "apps/data/prod/services/am-identity"
      service-oauth:
        path: "apps/data/prod/services/am-trade-management"

env:
  SPRING_PROFILES_ACTIVE: "prod"
  MONGODB_DATABASE: "trade"
  # Match prod Kafka (same as portfolio/doc): SCRAM over PLAINTEXT listener
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  # Ensure trade consumer is on even if jar predates application-kafka.yml import
  AM_TRADE_KAFKA_TRADE_CONSUMER_ENABLED: "true"
  AM_TRADE_KAFKA_TRADE_TOPIC: "am-trade"
  AM_TRADE_KAFKA_TRADE_CONSUMER_GROUP_ID: "am-trade-group"
  SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
  AM_TRADE_KAFKA_HOLDING_UPDATE_TOPIC: "am-portfolio"
  AM_TRADE_KAFKA_PORTFOLIO_UPDATE_CONSUMER_ENABLED: "true"
  AM_TRADE_KAFKA_PORTFOLIO_UPDATE_TOPIC: "am-portfolio-update"
  AM_TRADE_KAFKA_PORTFOLIO_UPDATE_CONSUMER_GROUP_ID: "am-trade-portfolio-update-group"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd,
      am-apps-prod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /trade
          pathType: Prefix
        - path: /trades
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi
