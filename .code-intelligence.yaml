enabled: true
tool: gitnexus
phase: local
versions:
  gitnexus: 1.6.9
  graphifyy: 0.4.11
production:
  branch: main
  embeddings: false
  ci: false
  mode: verify
local:
  sync_on_commit: true
  sync_on_save: false
  index_workspace: true
  watch_debounce_sec: 30
gitnexus:
  skipAgentsMd: true
  skipSkills: true
  group_path: trade/am-trade-management
graphify:
  sources:
  - docs/
  - backend/templates/
  - attachments/
  out: graphify-out/
  mcp_name: graphify-corp-docs
  llm_policy: local
capabilities:
  domain: trade
  surfaces:
  - http
  - kafka
  - libs
