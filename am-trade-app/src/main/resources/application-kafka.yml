# Kafka Configuration
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:am-trade-group}
      # earliest: after group reset/bump, catch up missed am-portfolio-update events
      # (upsert + symbol dedupe make replay safe). latest caused Demo Portfolio when
      # fan-out landed while the consumer was down/restarting.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        fetch.max.bytes: 1048576
        max.partition.fetch.bytes: 524288
        fetch.max.wait.ms: 500
        max.poll.records: 100
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME:kafkaUser}" password="${KAFKA_SASL_PASSWORD}";}

# Kafka Topics
am:
  trade:
    kafka:
      holding-update:
        topic: am-portfolio
      producer:
        enabled: true
      portfolio-update:
        topic: am-portfolio-update
        # bump group so earliest reset re-reads topic after Oct 5 latest revert
        consumer-group-id: am-trade-portfolio-update-group-v5
        consumer:
          enabled: true
      trade:
        consumer:
          enabled: true
        topic: am-trade
        consumer-group-id: am-trade-group
      oms-fills:
        consumer:
          enabled: true
        topic: am-oms-fills
        consumer-group-id: am-oms-fills-group
      retries: 3
      retry-backoff-ms: 1000
      max-poll-records: 500
